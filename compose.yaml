services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sbo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sbo
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - sbo_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbo -d sbo"]
      interval: 5s
      timeout: 5s
      retries: 12
  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://sbo:${POSTGRES_PASSWORD}@db:5432/sbo
    depends_on:
      db:
        condition: service_healthy
  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sbo:${POSTGRES_PASSWORD}@db:5432/sbo
      APP_ORIGINS: ${APP_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  sbo_postgres:
